services:
  searxng:
    image: searxng/searxng:latest
    container_name: valera-searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8080/
    # Restrict to localhost by binding host port only on loopback if desired:
    # ports: ["127.0.0.1:8080:8080"]
